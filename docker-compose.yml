services:
  postgres:
    image: postgres:16-alpine
    container_name: shopsense_postgres
    restart: always
    environment:
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense_password
      POSTGRES_DB: shopsensedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsense -d shopsensedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shopsense_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopsense_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://shopsense:shopsense_password@postgres:5432/shopsensedb
      SECRET_KEY: shopsense-production-secret-jwt-key-2026-xyz
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopsense_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
